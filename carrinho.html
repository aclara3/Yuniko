<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carrinho — Yuniku</title>
<script>try{if(JSON.parse(localStorage.getItem("yuniku:tema"))==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Federo&family=Hina+Mincho&family=Outfit:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="site-header"></div>

<main class="cart-page">
  <div class="deco-edge" aria-hidden="true"></div>
  <div class="cart-stage">
    <div class="deco-leaves" aria-hidden="true"></div>
    <div class="cart-layout">
      <section class="panel-card cart-card" aria-labelledby="cart-title">
        <h1 id="cart-title">Seu carrinho contém 0 itens</h1>
        <div class="cart-items" id="cart-items"></div>
        <div class="cart-foot">
          <div class="total-row"><span class="lbl">Total:</span><span class="total-value" id="total-value">R$ 0,00</span></div>
          <div class="coupon-row" id="coupon-row"></div>
          <button class="checkout" id="checkout" type="button">Finalizar compra</button>
        </div>
      </section>
      <aside class="panel-card orders-card" aria-labelledby="orders-title">
        <h2 id="orders-title">Seus pedidos</h2>
        <div id="orders-body"></div>
      </aside>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="data.js"></script>
<script src="app.js"></script>
<script src="carrinho.js"></script>
</body>
</html>
